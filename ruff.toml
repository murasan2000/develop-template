# Python lint + format configuration (ruff replaces flake8/isort/black).
# A derived project may move this into its own pyproject.toml under [tool.ruff].
target-version = "py313"
line-length = 100

exclude = [".venv", "node_modules", ".terraform"]

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
]
ignore = [
  "E501", # line length is handled by the formatter
]

[lint.per-file-ignores]
"tests/**" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
