# 本番 stage（prod）で使う静的配信の設定。
# SPA なので、実ファイルが無いパスは index.html にフォールバックさせる
# （クライアントサイドルーティングを直リンクで開けるようにするため）。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ハッシュ付きのビルド成果物は不変なので長期キャッシュしてよい。
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
