[project]
name = "chat-template-api"
version = "0.1.0"
description = "FastAPI + Google ADK チャットテンプレートのバックエンド"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.34",
  "google-adk[db]>=2.9.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30",
  "pydantic>=2.11",
  "pydantic-settings>=2.8",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.26",
  "httpx>=0.28",
  "aiosqlite>=0.21",
  "mypy>=1.15",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ruff の設定はリポジトリルートの ruff.toml を使う（ここには書かない）。
# mypy はパッケージ単位の設定が要るためここに置く。
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# ADK / google-genai は型スタブが完全ではないため、未解決 import だけ許容する。
module = ["google.adk.*", "google.genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
